      else if (es.reqExact) ok = ((P.coreElems || []).length === es.reqExact);
      else if (es.reqAscendant) ok = P.ascendant;
      if (ok) btns.push({ label: `${es.name} (${es.cost}SP)`, fn: () => unlockSpell(es) });
    });
    btns.push({ label: 'TUTUP', fn: () => { setLog('Kamu menutup Grimoire.', moveBtns()); } });

  function recalcStats() {
    if (P.ascendant) {
      P.maxHp = 9999; P.hp = 9999; P.maxMp = 9999; P.mp = 9999; P.atk = 999; P.def = 999;
      return;
    }
    const oldMaxHp = P.maxHp;
    P.maxHp = Math.floor(P.stats.vitalis * 3);
    P.hp = Math.max(1, P.hp + (P.maxHp - oldMaxHp));

    let eqMp = P.items.includes('Magic Ring') ? 6 : 0;
    const oldMaxMp = P.maxMp;
    P.maxMp = Math.floor(P.stats.aether * 1.2) + eqMp;
    P.mp = Math.max(0, P.mp + (P.maxMp - oldMaxMp));

    let eqAtk = 0;
    if (P.items.includes('Steel Sword')) eqAtk = 10;
    else if (P.items.includes('Iron Sword')) eqAtk = 5;

    let eqDef = 0;
    if (P.items.includes('Steel Armor')) eqDef = 6;
    else if (P.items.includes('Dark Armor')) eqDef = 4;
    else if (P.items.includes('Iron Armor')) eqDef = 3;

    if (!P.crystalAtk) P.crystalAtk = 0;

    P.atk = Math.floor(P.stats.might * 1.2) + eqAtk + P.crystalAtk;
    P.def = Math.floor(P.stats.vitalis * 0.6) + eqDef;

    if (P.hp > P.maxHp) P.hp = P.maxHp;
    if (P.mp > P.maxMp) P.mp = P.maxMp;
  }

  ⚡ Velocity: ${s.velocity} (Dodge${s.velocity >= 50 ? ', Auto-Dodge' : ''})<br>
  🍀 Fortune: ${s.fortune} (Crit, Drop${s.fortune >= 70 ? ', SuperCrit' : ''})<br>
  ❤️ Vitalis: ${s.vitalis} (HP, Regen)<br>
  🌌 Aether: ${s.aether} (MP, Burst Pwr)<br>
  </span>`;
    const btns = [];
    if (P.statPoints > 0) {
      btns.push({ label: '+MIGHT', fn: () => { P.statPoints--; P.stats.might++; recalcStats(); updateHUD(); showAetherCore(); } });
      btns.push({ label: '+INSIGHT', fn: () => { P.statPoints--; P.stats.insight++; recalcStats(); updateHUD(); showAetherCore(); } });
      btns.push({ label: '+VELO', fn: () => { P.statPoints--; P.stats.velocity++; recalcStats(); updateHUD(); showAetherCore(); } });
      btns.push({ label: '+FORTUNE', fn: () => { P.statPoints--; P.stats.fortune++; recalcStats(); updateHUD(); showAetherCore(); } });
      btns.push({ label: '+VITALIS', fn: () => { P.statPoints--; P.stats.vitalis++; recalcStats(); updateHUD(); showAetherCore(); } });
      btns.push({ label: '+AETHER', fn: () => { P.statPoints--; P.stats.aether++; recalcStats(); updateHUD(); showAetherCore(); } });
    }
    btns.push({ label: 'TUTUP', fn: () => { inputLock = false; setLog('Menutup Aether Core.', moveBtns()); updateHUD(); } });
    setLog(txt, btns);
  }

  //system use item
  function useItemOW(idx) {
    if (state !== 'over' && state !== 'dungeon') return;
    const it = P.items[idx];
    let txt = '';
    if (it === 'Dark Potion') { const h = 25 + Math.floor(Math.random() * 10); P.hp = Math.min(P.maxHp, P.hp + h); P.items.splice(idx, 1); txt = `Dark Potion! +${h}HP`; }
    else if (it === 'Hi-Potion') { const h = 55 + Math.floor(Math.random() * 15); P.hp = Math.min(P.maxHp, P.hp + h); P.items.splice(idx, 1); txt = `Hi-Potion! +${h}HP`; }
    else if (it === 'Elixir') { P.hp = P.maxHp; P.mp = P.maxMp; P.items.splice(idx, 1); txt = 'Elixir! HP & MP penuh!'; }
    else if (it === 'Ether') { P.mp = Math.min(P.maxMp, P.mp + 12); P.items.splice(idx, 1); txt = 'Ether! +12MP'; }
    else if (it === 'Antidote') { P.status = 'OK'; P.items.splice(idx, 1); txt = 'Antidote! Racun sembuh!'; }
    else { setLog(`${it} tidak bisa dipakai di sini.`, moveBtns()); return; }
    spawnParticles((P.x - camX) * TW + 16, (P.y - camY) * TW + 16, '#00ffaa', 10, 'star');
    updateParticles();
    setLog(txt, moveBtns()); updateHUD();
  }

  // function move/move over
  function move(dx, dy) {
    if (inputLock) return;
    if (state === 'over') moveOver(dx, dy);
    else if (state === 'dungeon') moveDungeon(dx, dy);
    else if (state === 'library') moveLibrary(dx, dy);
    else if (state === 'kingdom') moveKingdom(dx, dy);
    else if (state === 'palace') movePalace(dx, dy);
  }
  function moveOver(dx, dy) {
    const nx = P.x + dx, ny = P.y + dy;
    if (nx < 0 || nx >= MW || ny < 0 || ny >= MH) return;
    if (!P.ascendant && OSOLID[OMAP[ny][nx]]) return;
    const npc = NPCS.find(n => n.x === nx && n.y === ny);
    if (npc) { talkNPC(npc); return; }

    if (typeof ECHOES !== 'undefined') {
      const echo = ECHOES.find(e => e.x === nx && e.y === ny && !e.found);
      if (echo) {
        echo.found = true;
        setLog(`<span style="color:#aa88ff">✨ [LORE ECHO]</span><br><i>${echo.text}</i>`, moveBtns());
        P.x = nx; P.y = ny; drawOver(); updateHUD(); return;
      }
    }

    P.x = nx; P.y = ny; osteps++;
    if (P.status === 'POISON' && osteps % 3 === 0) { P.hp = Math.max(1, P.hp - 3); }
    const ch = OCHESTS.find(c => c.x === nx && c.y === ny && !c.open);
    if (ch) { openChest(ch); drawOver(); updateHUD(); return; }
    if (OMAP[ny][nx] === OT.UMBRA_CORE) { startBattle(JSON.parse(JSON.stringify(ELDROOT_BOSS)), 'obattle'); return; }
    if (OMAP[ny][nx] === OT.DUNGEON) { enterDungeon(); return; }
    if (OMAP[ny][nx] === OT.LIBRARY) { enterLibrary(); return; }
    if (OMAP[ny][nx] === OT.TOWN_HUMAN) { enterKingdom('Aurelis'); return; }
    if (OMAP[ny][nx] === OT.TOWN_ELF) { enterKingdom('Elaria'); return; }
    if (OMAP[ny][nx] === OT.TOWN_DWARF) { enterKingdom('Tharvok'); return; }

    let isUmbra = inUmbra(nx, ny);
    if (isUmbra && Math.random() < 0.15) {
      P.aetherEnergy = Math.max(0, P.aetherEnergy - 5);
      if (P.mp > 0) P.mp--;
      setLog('<span style="color:#aa55ff">Hutan menelan cahayamu... (Aether terkuras)</span>', moveBtns());
      drawOver(); updateHUD(); return;
    }

    let encounterRate = isUmbra ? 0.35 : 0.30;
    if (osteps % 4 === 0 && Math.random() < encounterRate) startBattle(pickOEnemy(), 'obattle');
    else { setLog(isUmbra ? '<span style="color:#888">Keheningan yang mencekam...</span>' : 'Kamu melangkah di bumi Luminia...', moveBtns()); drawOver(); }
    updateHUD();
  }

  //kingdom system 
  function enterKingdom(name) {
    if (!P.visitedKingdoms) P.visitedKingdoms = [];
    if (!P.visitedKingdoms.includes(name)) P.visitedKingdoms.push(name);
    curKingdom = name;
    kmap = mkKingdomMap(name);
    state = 'kingdom';
    P.x = 24; P.y = 43;
    if (name === 'Elaria') P.y = 39;
    setLog(`Memasuki <span style="color:#aa55ff">${name}</span>.`, moveBtns());
    drawKingdom(); updateHUD();
  }

      m[25][24] = KT.WATER; m[25][25] = KT.WATER;

  //draw kingdom place 
  function drawKingdom() {
    updateCam();
    ctx.clearRect(0, 0, 576, 352);
    const t = Date.now() / 1000;
    for (let y = camY; y < camY + VH && y < 50; y++) {
      for (let x = camX; x < camX + VW && x < 50; x++) {
        const sx = (x - camX) * TW, sy = (y - camY) * TW;
        const ti = kmap[y][x];
        ctx.fillStyle = KCOL[ti] || '#000';
        ctx.fillRect(sx, sy, TW, TW);
        if (ti === KT.GRASS) {
          ctx.fillStyle = '#3a8a2a';
          if ((x + y) % 2 === 0) { ctx.fillRect(sx + 4, sy + 8, 2, 4); ctx.fillRect(sx + 18, sy + 22, 2, 4); }
          else if ((x * y) % 3 === 0) { ctx.fillRect(sx + 10, sy + 14, 4, 2); }
        }
        else if (ti === KT.PATH) {
          ctx.fillStyle = '#665544';
          ctx.fillRect(sx + 4, sy + 4, 8, 6);
          ctx.fillRect(sx + 18, sy + 12, 10, 8);
          ctx.fillRect(sx + 8, sy + 24, 6, 4);
        }
        else if (ti === KT.HOUSE) {
          ctx.fillStyle = '#d2b48c'; ctx.fillRect(sx + 2, sy + 12, 28, 18);
          ctx.fillStyle = '#8b2222'; ctx.beginPath(); ctx.moveTo(sx, sy + 12); ctx.lineTo(sx + 16, sy + 2); ctx.lineTo(sx + 32, sy + 12); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#5c3a21'; ctx.fillRect(sx + 12, sy + 20, 8, 10);
          ctx.fillStyle = '#87ceeb'; ctx.fillRect(sx + 4, sy + 16, 6, 6); ctx.fillRect(sx + 22, sy + 16, 6, 6);
        }
        else if (ti === KT.MARKET) {
          ctx.fillStyle = '#d2b48c'; ctx.fillRect(sx + 4, sy + 14, 24, 16);
          ctx.fillStyle = '#5c3a21'; ctx.fillRect(sx + 6, sy + 14, 2, 16); ctx.fillRect(sx + 24, sy + 14, 2, 16);
          ctx.fillStyle = '#eee'; ctx.fillRect(sx + 2, sy + 4, 28, 10);
          ctx.fillStyle = ((x + y) % 2 === 0) ? '#cc2222' : '#2222cc';
          for (let i = 0; i < 4; i++) ctx.fillRect(sx + 2 + i * 7, sy + 4, 4, 10);
        }
        else if (ti === KT.PALACE) {
          ctx.fillStyle = '#bb9955'; ctx.fillRect(sx, sy, TW, TW);
          ctx.fillStyle = '#886633'; ctx.fillRect(sx + 4, sy + 4, 6, 6); ctx.fillRect(sx + 14, sy + 4, 4, 6); ctx.fillRect(sx + 22, sy + 4, 6, 6);
          ctx.fillStyle = '#221100'; ctx.fillRect(sx + 10, sy + 16, 12, 16);
        }
        else if (ti === KT.GATE) {
          ctx.fillStyle = '#444'; ctx.fillRect(sx, sy, TW, TW);
          ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(sx + 16, sy + 16, 10, Math.PI, 0); ctx.fill(); ctx.fillRect(sx + 6, sy + 16, 20, 16);
          ctx.fillStyle = '#777'; for (let i = 0; i < 4; i++) ctx.fillRect(sx + 8 + i * 5, sy + 8, 2, 24);
        }
        else if (ti === KT.WATER) {
          ctx.fillStyle = `rgba(100,160,255,${.08 + .04 * Math.sin(t * 2 + x + y)})`; ctx.fillRect(sx, sy, TW, TW);
          ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(sx + 4, sy + 8, 12, 2); ctx.fillRect(sx + 16, sy + 20, 8, 2);
        }
        else if (ti === KT.FOUNTAIN) {
          ctx.fillStyle = '#666'; ctx.beginPath(); ctx.arc(sx + 16, sy + 16, 14, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = `rgba(100,180,255,${.6 + .2 * Math.sin(t * 4)})`; ctx.beginPath(); ctx.arc(sx + 16, sy + 16, 10, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.fillRect(sx + 15, sy + 10, 2, 12);
        }
        else if (ti === KT.LAVA) {
          ctx.fillStyle = `rgba(255,100,0,${.6 + .2 * Math.sin(t * 3 + x + y)})`; ctx.fillRect(sx, sy, TW, TW);
          if ((x * y) % 3 === 0) { ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(sx + 10, sy + 10, 4, 0, Math.PI * 2); ctx.fill(); }
        }
        else if (ti === KT.WALL) {
          ctx.fillStyle = '#444'; ctx.fillRect(sx, sy, TW, TW);
          ctx.fillStyle = '#333'; ctx.fillRect(sx, sy + 8, TW, 2); ctx.fillRect(sx, sy + 20, TW, 2);
          ctx.fillRect(sx + 8, sy, 2, 8); ctx.fillRect(sx + 24, sy, 2, 8);
          ctx.fillRect(sx + 16, sy + 10, 2, 10);
        }
        else if (ti === KT.CAVE_WALL) {
          ctx.fillStyle = '#221100'; ctx.beginPath(); ctx.moveTo(sx + 4, sy + 4); ctx.lineTo(sx + 28, sy + 8); ctx.lineTo(sx + 24, sy + 28); ctx.lineTo(sx + 8, sy + 24); ctx.closePath(); ctx.fill();
        }
        else if (ti === KT.FORGE) {
          ctx.fillStyle = '#333'; ctx.fillRect(sx + 8, sy + 14, 16, 10);
          ctx.fillRect(sx + 4, sy + 10, 24, 4);
          ctx.fillStyle = `rgba(255,100,0,${.5 + .3 * Math.sin(t * 5)})`; ctx.fillRect(sx + 10, sy + 24, 12, 6);
        }
        else if (ti === KT.TREE) {
          ctx.fillStyle = '#1d5e14'; ctx.beginPath(); ctx.arc(sx + 16, sy + 12, 12, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#2d7a1e'; ctx.beginPath(); ctx.arc(sx + 16, sy + 10, 8, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#5a3a10'; ctx.fillRect(sx + 13, sy + 20, 6, 10);
        }
      }
    }

    knpcs.forEach(n => { if (n.x >= camX && n.x < camX + VW && n.y >= camY && n.y < camY + VH) { ctx.font = '18px serif'; ctx.fillText(n.spr, (n.x - camX) * TW + 6, (n.y - camY) * TW + 22); } });

    const px = (P.x - camX) * TW, py = (P.y - camY) * TW;
    ctx.fillStyle = `rgba(180,100,255,0.2)`; ctx.beginPath(); ctx.arc(px + 16, py + 16, 22, 0, Math.PI * 2); ctx.fill();
    ctx.font = '20px serif'; ctx.fillText('🧑‍🦱', px + 6, py + 22);

    mctx.clearRect(0, 0, 88, 66);
    const scX = 88 / 50, scY = 66 / 50;
    for (let y = 0; y < 50; y++) for (let x = 0; x < 50; x++) {
      mctx.fillStyle = KCOL[kmap[y][x]] || '#000';
      mctx.fillRect(x * scX, y * scY, scX + 0.5, scY + 0.5);
    }
    mctx.fillStyle = '#aa55ff'; mctx.fillRect(P.x * scX - 1, P.y * scY - 1, scX + 2, scY + 2);
  }

  function moveKingdom(dx, dy) {
    const nx = P.x + dx, ny = P.y + dy;
    if (nx < 0 || nx >= 50 || ny < 0 || ny >= 50) return;
    if (!P.ascendant && KSOLID[kmap[ny][nx]]) return;

    const npc = knpcs.find(n => n.x === nx && n.y === ny);
    if (npc) {
      if (P.ascendant) {
        setLog(`<b>${npc.name || 'Seseorang'}:</b><br><span style="color:#ff0000; font-family:monospace; font-size:18px">TIDAK... REALITAS INI HANCUR... KAU... APA KAU?!</span>`, moveBtns());
        return;
      }
      if (npc.shop) {
        if (npc.sType === 'Aurelis') shopAurelis();
        else if (npc.sType === 'Elaria') shopElaria();
        else if (npc.sType === 'Tharvok') shopTharvok();
        return;
      }
      if (npc.isGate) { showTeleport(); return; }
      talkNPC(npc); return;
    }

    if (kmap[ny][nx] === KT.GATE) { enterPalace(); return; }
    if (kmap[ny][nx] === KT.WATER && curKingdom === 'Elaria') { P.hp = P.maxHp; P.mp = P.maxMp; setLog('Air suci memulihkan jiwamu.', moveBtns()); }
    if (kmap[ny][nx] === KT.EXIT) {
      state = 'over';
      P.x = curKingdom === 'Aurelis' ? 50 : curKingdom === 'Elaria' ? 85 : 15;
      P.y = curKingdom === 'Aurelis' ? 40 : curKingdom === 'Elaria' ? 15 : 65;
      setLog(`Keluar dari ${curKingdom}.`, moveBtns());
      drawOver(); updateHUD(); return;
    }

    P.x = nx; P.y = ny;
    setLog(`Jalanan ${curKingdom}...`, moveBtns());
    drawKingdom(); updateHUD();
  }

      } else {

  function enterPalace() {
    pfloor = 0;
    pmap = mkPalace(curKingdom, pfloor);
    state = 'palace';
    P.x = 6; P.y = 7;
    setLog(`Memasuki Istana ${curKingdom}.`, moveBtns());
    drawPalace(); updateHUD();
  }

  function drawPalace() {
    ctx.clearRect(0, 0, 576, 352);
    const offsetX = (576 - 14 * DTW) / 2, offsetY = (352 - 9 * DTW) / 2;
    const cols = PCOL[curKingdom];
    for (let y = 0; y < 9; y++) {
      for (let x = 0; x < 14; x++) {
        const ti = pmap[y][x];
        const px = offsetX + x * DTW, py = offsetY + y * DTW;
        ctx.fillStyle = cols[ti] || '#000';
        ctx.fillRect(px, py, DTW, DTW);
        if (ti === PT.EXIT) { ctx.fillStyle = '#1a3300'; ctx.fillRect(px + 8, py + 4, DTW - 16, DTW - 8); ctx.fillStyle = '#33cc00'; ctx.font = '10px serif'; ctx.fillText('OUT', px + 10, py + 24); }
        if (ti === PT.STAIR_UP) { ctx.fillStyle = '#0055cc'; ctx.fillRect(px + 4, py + 4, DTW - 8, DTW - 8); ctx.fillStyle = '#fff'; ctx.fillText('UP', px + 8, py + 24); }
        if (ti === PT.STAIR_DOWN) { ctx.fillStyle = '#0055cc'; ctx.fillRect(px + 4, py + 4, DTW - 8, DTW - 8); ctx.fillStyle = '#fff'; ctx.fillText('DN', px + 8, py + 24); }
      }
    }
    pchests.forEach(c => { if (!c.open) { ctx.font = '22px serif'; ctx.fillText('📦', offsetX + c.x * DTW + 8, offsetY + c.y * DTW + 28); } });
    pnpcs.forEach(n => { ctx.font = '22px serif'; ctx.fillText(n.spr, offsetX + n.x * DTW + 8, offsetY + n.y * DTW + 28); });

    const px = offsetX + P.x * DTW, py = offsetY + P.y * DTW;
    ctx.fillStyle = `rgba(180,80,255,0.2)`; ctx.beginPath(); ctx.arc(px + DTW / 2, py + DTW / 2, DTW / 2, 0, Math.PI * 2); ctx.fill();
    ctx.font = '22px serif'; ctx.fillText('🧑‍🦱', px + 8, py + 28);
    mctx.clearRect(0, 0, 88, 66);
  }

  function movePalace(dx, dy) {
    const nx = P.x + dx, ny = P.y + dy;
    if (nx < 0 || nx >= 14 || ny < 0 || ny >= 9) return;
    if (!P.ascendant && PSOLID[pmap[ny][nx]]) return;

    const npc = pnpcs.find(n => n.x === nx && n.y === ny);
    if (npc) { talkNPC(npc); return; }

    const ch = pchests.find(c => c.x === nx && c.y === ny && !c.open);
    if (ch) {
      ch.open = true; P.gold += ch.gold;
      if (ch.item) P.items.push(ch.item);
      setLog(`📦 Peti terbuka! +${ch.gold}G ${ch.item ? '+' + ch.item : ''}`, moveBtns());
      drawPalace(); updateHUD(); return;
    }

    if (pmap[ny][nx] === PT.STAIR_UP) {
      pfloor++; pmap = mkPalace(curKingdom, pfloor); P.x = 1; P.y = 2;
      setLog('Naik lantai.', moveBtns()); drawPalace(); updateHUD(); return;
    }
    if (pmap[ny][nx] === PT.STAIR_DOWN) {
      pfloor--; pmap = mkPalace(curKingdom, pfloor); P.x = 1; P.y = 2;
      setLog('Turun lantai.', moveBtns()); drawPalace(); updateHUD(); return;
    }
    if (pmap[ny][nx] === PT.EXIT) {
      state = 'kingdom';
      P.x = 24; P.y = 8;
      if (curKingdom === 'Elaria') { P.x = 24; P.y = 10; }
      else if (curKingdom === 'Tharvok') { P.x = 24; P.y = 12; }
      setLog(`Keluar dari Istana ${curKingdom}.`, moveBtns());
      drawKingdom(); updateHUD(); return;
    }

    P.x = nx; P.y = ny;
    setLog(`Mengitari Istana ${curKingdom}...`, moveBtns());
    drawPalace(); updateHUD();
  }

  function enterDungeon() {
    qProgress('enter_dungeon');
    dfi = 0; const d = mkDungeon(0); dmap = d.m; dobjs = d.obs; dvis = new Set();
    P.x = 1; P.y = 1; revealD(); state = 'dungeon';

  function exitDungeon() {
    state = 'over'; P.x = 12; P.y = 12;
    const heal = Math.floor(P.maxHp * .25); P.hp = Math.min(P.maxHp, P.hp + heal);
    setLog(`<span style="color:#88ffcc">Kamu keluar dari Black Dungeon!</span><br>+${heal}HP pulih. Selamat kembali, pahlawan!`, moveBtns());
    drawOver(); updateHUD();
  }
  function moveDungeon(dx, dy) {
    const nx = P.x + dx, ny = P.y + dy;
    if (nx < 0 || nx >= DC || ny < 0 || ny >= DR) return;
    if (!P.ascendant && dSolid(nx, ny)) {
      const loc = dobjs.find(o => o.type === 'locked' && o.x === nx && o.y === ny && !o.open);
      if (loc) {
        if (P.keys > 0) { loc.open = true; dmap[ny][nx] = DT.FLOOR; P.keys--; spawnParticles(nx * DTW + DTW / 2, ny * DTW + DTW / 2, '#ffcc00', 12, 'star'); updateParticles(); setLog('🔑 Kunci digunakan! Pintu terbuka!', moveBtns()); updateHUD(); }
        else setLog('Pintu dikunci! Butuh KUNCI.', moveBtns()); return;
      }
      return;
    }
    P.x = nx; P.y = ny; P.steps++;
    if (P.status === 'POISON' && P.steps % 3 === 0) { P.hp = Math.max(1, P.hp - 4); }
    if (P.defBuff > 0 && P.steps % 4 === 0) P.defBuff = Math.max(0, P.defBuff - 1);
    revealD();
    const obj = getDObj(nx, ny);
    if (obj) {
      if (obj.type === 'enemy' && obj.alive) { startBattle(obj, 'dbattle'); return; }
      if (obj.type === 'chest' && !obj.open) { openChest(obj); drawDungeon(); updateHUD(); return; }
      if (obj.type === 'trap' && !obj.used) { triggerTrap(obj); }
    }
    if (dmap[ny][nx] === DT.STAIR) {
      const bossLive = dobjs.find(o => o.type === 'enemy' && o.alive && o.boss);
      if (bossLive) setLog('⚠️ Aura gelap menghalangimu... Kalahkan Bos dulu!', moveBtns());
      else nextFloor();
      return;
    }
    if (dmap[ny][nx] === DT.EXIT) {
      exitDungeon();
      return;
    }
    setLog('Langkahmu bergema di lorong gelap...', moveBtns());
    drawDungeon(); updateHUD();
  }

  function flashEnemy(color = '#ff4400') {

  function eTurn() {
    let etxt = '';
    if (eDot > 0) {
      curEnemy.hp -= eDot;
      etxt += `🔥 Musuh terbakar ${eDot} dmg!<br>`;
      flashEnemy('#ff8800');
    }
    if (eDelay) {
      eDelay.turns--;
      if (eDelay.turns <= 0) {
        let ddmg = eDelay.dmg[0] + Math.floor(Math.random() * (eDelay.dmg[1] - eDelay.dmg[0]));
        curEnemy.hp -= ddmg;
        etxt += `💥 ${eDelay.name} meledak! ${ddmg} dmg!<br>`;
        flashEnemy('#ff0044');
        eDelay = null;
      } else {
        etxt += `⏳ ${eDelay.name} menghitung mundur...<br>`;
      }
    }

    if (curEnemy.hp <= 0) {
      return { dmg: 0, txt: etxt, died: true };
    }

    if (eSleep && Math.random() < .35) { eSleep = false; etxt += `${curEnemy.name} terbangun!<br>`; }
    if (eSleep) return { dmg: 0, txt: etxt };
    if (P.antiDebuff > 0) P.antiDebuff--;
    if (P.aetherState > 0) {
      P.aetherState--;
      if (P.aetherState === 0) etxt += `<span style="color:#aa55ff">Aether Burst telah berakhir.</span><br>`;
    }

    let regenAmt = Math.floor(P.stats.vitalis / 5) + P.regenBuff;
    if (regenAmt > 0 && P.hp < P.maxHp) {
      P.hp = Math.min(P.maxHp, P.hp + regenAmt);
      if (P.regenBuff > 0) etxt += `✨ Regen memulihkan ${P.regenBuff} HP!<br>`;
    }

    if (eAccDown > 0 && Math.random() * 100 < eAccDown) {
      etxt += `💨 Serangan musuh meleset karena akurasi turun!<br>`;
      return { dmg: 0, txt: etxt };
    }

    let edm = Math.max(1, curEnemy.atk - (P.def + (P.defBuff || 0)) + Math.floor(Math.random() * 5));
    if (curEnemy.boss && Math.random() < .28) { edm = Math.floor(edm * 1.6); etxt += `<span style="color:#ff6600">Serangan brutal!</span><br>`; }

    if (inUmbra(P.x, P.y)) {
      if (curEnemy.name === 'Eldroot Umbra' && Math.random() < 0.4) {
        edm += 25;
        if (Math.random() < 0.5) { P.status = 'POISON'; etxt += 'Akar beracun menyayatmu!<br>'; }
        else { P.hp = Math.max(0, P.hp - 10); etxt += 'Aura korupsi menghisap nyawamu!<br>'; }
      } else if (!curEnemy.boss && Math.random() < 0.3) {
        edm += 15;
        etxt += `<span style="color:#aa55ff">${curEnemy.name} menggunakan sihir terdistorsi!</span><br>`;
      }
    }

    let dodgeChance = 0.05;
    if (P.stats.velocity >= 50) dodgeChance = 0.15;
    if (P.dodgeBuff > 0) dodgeChance += P.dodgeBuff;

    if (Math.random() < dodgeChance) {
      etxt += `<span style="color:#00ffcc">Kecepatan luar biasa! Menghindari serangan!</span><br>`;
      return { dmg: 0, txt: etxt };
    }

    if (P.dodging) {
      P.dodging = false;
      const isFast = Math.random() < Math.max(0.05, 0.30 - P.stats.velocity * 0.005);
      if (isFast) etxt += `<span style="color:#ff6600">Serangan musuh terlalu cepat! Gagal menghindar!</span><br>`;
      else { etxt += `<span style="color:#00ffcc">Berhasil menghindari serangan!</span><br>`; return { dmg: 0, txt: etxt }; }
    }

    if (P.blockNext) {
      P.blockNext = false;
      etxt += `🛡️ Serangan musuh diblokir sepenuhnya!<br>`;
      return { dmg: 0, txt: etxt };
    }

    if (P.dmgReduce < 1) {
      edm = Math.floor(edm * P.dmgReduce);
      etxt += `🛡️ Damage dikurangi drastis!<br>`;
    }

    if (curEnemy.name === 'Vampire Lord' && Math.random() < .25) { if (P.antiDebuff > 0) etxt += 'Kebal debuff!<br>'; else { P.status = 'DRAIN'; etxt += 'Kamu dilemahkan!<br>'; } }
    if (curEnemy.name === 'Ancient Lich' && Math.random() < .2) { if (P.antiDebuff > 0) etxt += 'Kebal debuff!<br>'; else { P.status = 'POISON'; etxt += '☠️ Diracun oleh Lich!<br>'; } }
    if (curEnemy.name === 'Dark Mage' && Math.random() < .3) { edm += 10; etxt += 'Mantra gelap!<br>'; }

    P.hp = Math.max(0, P.hp - edm);
    if (edm > 0) {
      P.growth.hit++;
      if (P.growth.hit >= 15) {
        P.growth.hit = 0; P.stats.vitalis++; recalcStats();
        etxt += ' <span style="color:#00ffaa">[VITALIS UP]</span><br>';
      }
    }
    if (P.reflectBuff > 0 && edm > 0) {
      curEnemy.hp -= P.reflectBuff;
      etxt += `🪞 Memantulkan ${P.reflectBuff} dmg!<br>`;
      flashEnemy('#aaaaff');
      if (curEnemy.hp <= 0) return { dmg: edm, txt: etxt, died: true };
    }

    if (edm > 0) P.aetherEnergy = Math.min(100, P.aetherEnergy + 10);

    if (P.hp <= 0 && P.autoRevive > 0) {
      P.hp = Math.floor(P.maxHp * P.autoRevive);
      P.autoRevive = 0;
      etxt += `🔥 Phoenix Spark bangkit! Kamu hidup kembali dengan ${P.hp} HP!<br>`;
    }

    return { dmg: edm, txt: etxt };
  }
  function doDodge() {
    if (inputLock) return; inputLock = true;
    P.dodging = true;
    P.growth.dodge++;
    let txt = 'Kamu bersiap menghindari serangan...';
    if (P.growth.dodge >= 5) { P.growth.dodge = 0; P.stats.velocity++; recalcStats(); txt += ' <span style="color:#00ffaa">[VELOCITY UP]</span>'; }
    setTimeout(() => {
      const turnRes = eTurn();
      if (turnRes.txt) txt += `<br>${turnRes.txt}`;
      if (turnRes.dmg > 0) txt += `<br>${curEnemy.name}: ${turnRes.dmg} dmg!`;
      if (turnRes.died) { winBattle(0); inputLock = false; updateHUD(); return; }
      if (P.hp <= 0) { die(); inputLock = false; return; }
      showBattleUI(); addLog(txt); updateHUD(); inputLock = false;
    }, 360);
  }
  function doAtk() {
    if (inputLock) return; inputLock = true;

    if (inUmbra(P.x, P.y)) {
      const hasLight = (P.unlockedSpells || []).includes('LUMINIS') || (P.items || []).includes('Lumina Orb');
      if (!hasLight && Math.random() < 0.4) {
        let txt = `Hutan terlalu gelap! Serangan meleset!`;
        setTimeout(() => {
          const turnRes = eTurn();
          if (turnRes.txt) txt += `<br>${turnRes.txt}`;
          if (turnRes.dmg > 0) txt += `<br>${curEnemy.name}: ${turnRes.dmg} dmg!`;
          if (turnRes.died) { winBattle(0); inputLock = false; updateHUD(); return; }
          if (P.hp <= 0) { die(); inputLock = false; return; }
          showBattleUI(); addLog(txt); updateHUD(); inputLock = false;
        }, 360);
        return;
      }
    }

    let dmg = Math.max(1, P.atk + (P.atkBuff || 0) - Math.floor((curEnemy.def || 0) / 2) + Math.floor(Math.random() * 7));
    if (P.comboSetup) {
      dmg = Math.floor(dmg * 1.5);
      P.comboSetup = false;
    }
    let isCrit = Math.random() < (P.stats.fortune * 0.005);
    if (isCrit) dmg = Math.floor(dmg * (P.stats.fortune >= 70 ? 2.5 : 1.5));
    if (P.aetherState > 0) dmg = Math.floor(dmg * 1.5);
    curEnemy.hp -= dmg;
    flashEnemy('#fff');
    const cx = state === 'dungeon' ? P.x * DTW + DTW / 2 : (P.x - camX) * TW + TW / 2;
    const cy = state === 'dungeon' ? P.y * DTW + DTW / 2 : (P.y - camY) * TW + TW / 2;
    const ex = state === 'dbattle' ? curEnemy.x * DTW + DTW / 2 : 280;
    const ey = state === 'dbattle' ? curEnemy.y * DTW + DTW / 2 : 80;
    spawnParticles(cx, cy, '#eee', 5);
    setTimeout(() => {
      spawnParticles(ex, ey, isCrit ? '#ffff00' : '#ff0044', isCrit ? 15 : 10); updateParticles();
      P.growth.atk++; P.aetherEnergy = Math.min(100, P.aetherEnergy + 5);
      let growthTxt = '';
      if (P.growth.atk >= 10) { P.growth.atk = 0; P.stats.might++; recalcStats(); growthTxt += ' <span style="color:#00ffaa">[MIGHT UP]</span>'; }
      if (isCrit) {
        P.growth.fortune++;
        if (P.growth.fortune >= 10) { P.growth.fortune = 0; P.stats.fortune++; recalcStats(); growthTxt += ' <span style="color:#00ffaa">[FORTUNE UP]</span>'; }
      }
      let txt = `Kamu menyerang! ${isCrit ? '<span style="color:#ffff00">CRITICAL!</span> ' : ''}<span style="color:#ff8888">${dmg}</span> dmg!${growthTxt}`;
      if (curEnemy.hp <= 0) { winBattle(dmg); inputLock = false; updateHUD(); return; }
      setTimeout(() => {
        const turnRes = eTurn(); if (turnRes.txt) txt += `<br>${turnRes.txt}`;
        if (turnRes.dmg > 0) txt += `<br>${curEnemy.name}: ${turnRes.dmg} dmg!`;
        if (turnRes.died) { winBattle(0); inputLock = false; updateHUD(); return; }
        if (P.hp <= 0) { die(); inputLock = false; return; }
        showBattleUI(); addLog(txt); updateHUD(); inputLock = false;
      }, 360);
    }, 200);
  }
  function showMagicMenu() {
    const allSpells = [...SPELLS, ...ELEM_SPELLS];
    const avail = allSpells.filter(s => (P.unlockedSpells || []).includes(s.name) && P.mp >= s.mp);
    if (!avail.length) { setLog('Belum ada sihir atau MP tidak cukup!', moveBtns()); setTimeout(showBattleUI, 1200); return; }
    const btns = avail.map(s => ({ label: `${s.name}(${s.mp}MP)`, fn: () => castSpell(s) }));
    btns.push({ label: 'KEMBALI', fn: showBattleUI });
    setLog('Pilih mantra:', btns);
  }
  function castSpell(sp) {
    if (inputLock) return; inputLock = true;
    let cost = sp.mp;
    if (P.stats.insight >= 60) cost = Math.max(1, cost - 2);
    P.mp -= cost;
    let txt = '';

    P.growth.spell++; P.aetherEnergy = Math.min(100, P.aetherEnergy + 8);
    if (P.growth.spell >= 8) { P.growth.spell = 0; P.stats.insight++; recalcStats(); txt += ' <span style="color:#00ffaa">[INSIGHT UP]</span><br>'; }

    if (sp.name === 'HEAL' || (sp.heal && !sp.dmg)) {
      const h = sp.name === 'HEAL' ? 20 + Math.floor(P.stats.insight * 1.5) + Math.floor(Math.random() * 12) : sp.heal;
      P.hp = Math.min(P.maxHp, P.hp + h); txt += `✨ ${sp.name}! +<span style="color:#88ffcc">${h}</span> HP!`;
      if (sp.purify) { P.status = 'OK'; txt += ' Status pulih!'; }
      if (sp.antiDebuff) { P.antiDebuff = 3; txt += ' Kebal debuff!'; }
      if (sp.regen) { P.regenBuff = sp.regen; txt += ' Regen aktif!'; }
      spawnParticles(state === 'dungeon' ? P.x * DTW + 16 : (P.x - camX) * TW + 16, state === 'dungeon' ? P.y * DTW + 16 : (P.y - camY) * TW + 16, '#00ffcc', 12, 'star'); updateParticles();
    }
    else if (sp.buff && !sp.dmg) {
      if (sp.def) P.defBuff = (P.defBuff || 0) + sp.def;
      if (sp.reflect) P.reflectBuff = sp.reflect;
      txt += `🛡 ${sp.name}!`;
      if (sp.def) txt += ` DEF +${sp.def} sementara!`;
      if (sp.reflect) txt += ` Reflect aktif!`;
    }
    else if (sp.buffAtk) {
      P.atkBuff = sp.buffAtk;
      txt += `🔥 ${sp.name}! ATK +${sp.buffAtk} sementara!`;
    }
    else if (sp.autoRevive) {
      P.autoRevive = sp.autoRevive;
      txt += `🔥 ${sp.name}! Phoenix menyertaimu!`;
    }
    else if (sp.blockNext) {
      P.blockNext = true;
      txt += `🛡️ ${sp.name}! Serangan musuh berikutnya akan diblokir!`;
    }
    else if (sp.accDown) {
      eAccDown = sp.accDown;
      txt += `💨 ${sp.name}! Akurasi musuh berkurang!`;
    }
    else if (sp.dmgReduce) {
      P.dmgReduce = sp.dmgReduce;
      txt += `🛡️ ${sp.name}! Damage musuh akan berkurang drastis!`;
    }
    else if (sp.dodgeBoost) {
      P.dodgeBuff = sp.dodgeBoost;
      txt += `💨 ${sp.name}! Kecepatan menghindar meningkat!`;
    }

    if (sp.dmg) {
      let hits = sp.multiHit || 1;
      let totalDmg = 0;
      for (let i = 0; i < hits; i++) {
        let dmg = sp.dmg[0] + Math.floor(Math.random() * (sp.dmg[1] - sp.dmg[0])) + Math.floor(P.stats.insight * 1.5);
        if (sp.name === 'ASTRAEL (Kosmos)' || sp.reqAscendant) dmg = sp.dmg[0];
        if (P.comboSetup) { dmg = Math.floor(dmg * 1.5); P.comboSetup = false; }
        if (P.aetherState > 0) dmg = Math.floor(dmg * 1.5);
        if (eShield) dmg = Math.floor(dmg * .6);
        totalDmg += dmg;
      }
      curEnemy.hp -= totalDmg; flashEnemy('#aa44ff');
      const sx = state === 'dbattle' ? curEnemy.x * DTW + DTW / 2 : 280, sy = state === 'dbattle' ? curEnemy.y * DTW + DTW / 2 : 80;
      spawnParticles(sx, sy, '#aa44ff', 14 * hits); updateParticles();
      txt += `✨ ${sp.name}! <span style="color:#cc88ff">${totalDmg}</span> dmg!${hits > 1 ? ` (${hits} Hit!)` : ''}`;

      if (sp.heal) { P.hp = Math.min(P.maxHp, P.hp + sp.heal); txt += ` +${sp.heal}HP!`; }
      if (sp.drain || sp.lifesteal) { const h = Math.floor(totalDmg * .45); P.hp = Math.min(P.maxHp, P.hp + h); txt += ` Serap <span style="color:#88ffcc">+${h}HP</span>!`; }
      if (sp.buff) { P.defBuff = (P.defBuff || 0) + sp.def; txt += ` DEF +${sp.def}!`; }
      if (sp.stun) { eSleep = true; txt += ` Musuh tertahan!`; }
      if (sp.debuff) { eShield = false; txt += ` Pertahanan hancur!`; }
      if (sp.dot) { eDot = sp.dot; txt += ` Musuh terbakar!`; }
      if (sp.delayDmg) { eDelay = { turns: 2, dmg: sp.delayDmg, name: sp.name }; txt += ` Menanam energi ledakan!`; }
      if (sp.regen) { P.regenBuff = sp.regen; txt += ` Regen aktif!`; }
      if (sp.dodgeBoost) { P.dodgeBuff = sp.dodgeBoost; txt += ` Menghindar meningkat!`; }
      if (sp.comboSetup) { P.comboSetup = true; txt += ` Setup combo!`; }
      if (sp.slow) { eAccDown = 20; txt += ` Gerakan musuh melambat!`; }

      if (curEnemy.hp <= 0) { winBattle(totalDmg); inputLock = false; updateHUD(); return; }
    }
    setTimeout(() => {
      const turnRes = eTurn();
      if (turnRes.txt) txt += `<br>${turnRes.txt}`;
      if (turnRes.dmg > 0) txt += `<br>${curEnemy.name}: ${turnRes.dmg} dmg!`;
      if (turnRes.died) { winBattle(0); inputLock = false; updateHUD(); return; }

      if (P.hp <= 0) { die(); inputLock = false; return; }
      showBattleUI(); addLog(txt); updateHUD(); inputLock = false;
    }, 360);
  }
  function showItemsMenu() {
    const usableItems = P.items.map((it, i) => ({ it, i })).filter(x => ['Dark Potion', 'Hi-Potion', 'Ether', 'Antidote', 'Elixir', 'Dark Crystal'].includes(x.it));
    if (!usableItems.length) { setLog('Tidak ada item yang bisa dipakai!', moveBtns()); setTimeout(showBattleUI, 1200); return; }
    const btns = usableItems.map(x => ({ label: x.it, cls: 'ib', fn: () => useItemBattle(P.items.indexOf(x.it)) }));
    btns.push({ label: 'KEMBALI', fn: showBattleUI });
    setLog('Gunakan item:', btns);
  }
  function useItemBattle(idx) {
    if (inputLock) return; inputLock = true;
    const it = P.items.splice(idx, 1)[0];
    let txt = '';
    if (it === 'Dark Potion') { const h = 25 + Math.floor(Math.random() * 12); P.hp = Math.min(P.maxHp, P.hp + h); txt = `Dark Potion! +${h}HP`; }
    else if (it === 'Hi-Potion') { const h = 55 + Math.floor(Math.random() * 15); P.hp = Math.min(P.maxHp, P.hp + h); txt = `Hi-Potion! +${h}HP`; }
    else if (it === 'Elixir') { P.hp = P.maxHp; P.mp = P.maxMp; txt = 'Elixir! HP & MP penuh!'; }
    else if (it === 'Ether') { P.mp = Math.min(P.maxMp, P.mp + 12); txt = 'Ether! +12MP'; }
    else if (it === 'Antidote') { P.status = 'OK'; txt = 'Antidote! Racun sembuh!'; }
    else if (it === 'Dark Crystal') { P.crystalAtk = (P.crystalAtk || 0) + 6; recalcStats(); txt = 'Dark Crystal! ATK permanen +6!'; }
    setTimeout(() => {
      const turnRes = eTurn();
      if (turnRes.txt) txt += `<br>${turnRes.txt}`;
      if (turnRes.dmg > 0) txt += `<br>${curEnemy.name}: ${turnRes.dmg} dmg!`;
      if (turnRes.died) { winBattle(0); inputLock = false; updateHUD(); return; }
      if (P.hp <= 0) { die(); inputLock = false; return; }
      showBattleUI(); addLog(txt); updateHUD(); inputLock = false;
    }, 220);
  }
  function doRun() {
    if (inputLock) return; inputLock = true;
    if (Math.random() < .48) {
      const was = state; state = (was === 'dbattle' ? 'dungeon' : 'over');
      curEnemy = null; setLog('Berhasil kabur!', moveBtns());
      if (state === 'dungeon') drawDungeon(); else drawOver();
      inputLock = false;
    } else {
      const edm = Math.max(1, curEnemy.atk - P.def + 4); P.hp = Math.max(0, P.hp - edm);
      if (P.hp <= 0) { die(); inputLock = false; return; }
      showBattleUI(); addLog(`Gagal kabur! ${curEnemy.name}: ${edm} dmg!`); updateHUD();
      inputLock = false;
    }
  }
  function winBattle(dmg) {
    const e = curEnemy;

    // THE FINAL ENCOUNTER LORE
    if (e.name === 'Great Black Dragon') {
      const isAscendantReqMet = (P.coreElems && P.coreElems.length === 4) || (typeof ECHOES !== 'undefined' && ECHOES.every(ec => ec.found));
      let choices = [
        {
          label: 'PRESERVE THE LIE', fn: () => {
            P.ascendant = false;
            setLog(`<span style="color:#ffd700">Kamu membunuh Naga Hitam...</span><br>Keseimbangan palsu dipertahankan. Kamu hidup sebagai "Pahlawan" di dunia yang tidak pernah utuh.<br><b>Gelar: THE FALSE SAVIOR</b>`, moveBtns());
            state = (state === 'dbattle' ? 'dungeon' : 'over'); curEnemy = null;
            if (state === 'dungeon') drawDungeon(); else drawOver(); updateHUD();
          }
        },
        {
          label: 'EMBRACE THE NIHIL', cls: 'rb', fn: () => {
            document.body.innerHTML = '<div style="color:red; background:black; height:100vh; display:flex; justify-content:center; align-items:center; font-family:monospace; font-size:24px;"><b>KEHANCURAN YANG JUJUR.</b><br>TIDAK ADA LAGI KEBOHONGAN.</div>';
          }
        }
      ];

      if (isAscendantReqMet) {
        choices.push({
          label: 'TRANSCEND (ASCENDANT)', cls: 'gb', fn: () => {
            P.ascendant = true; P.maxHp = 9999; P.maxMp = 9999; P.hp = 9999; P.mp = 9999; P.atk = 999; P.unlockedSpells.push('[ERASE]');
            setLog(`<span style="color:#aa55ff">Kamu menelan kekuatan sang Naga.</span><br>Sistem ini rapuh, dan kamu adalah celah yang kini menjadi <b>Tuhan</b>.<br>Realitas gemetar melihat keberadaanmu.`, moveBtns());
            state = (state === 'dbattle' ? 'dungeon' : 'over'); curEnemy = null;
            if (state === 'dungeon') drawDungeon(); else drawOver(); updateHUD();
          }
        });
      } else {
        choices.push({ label: '??? (SYARAT BELUM TERPENUHI)', fn: () => { } });
      }

      setLog(`<div style="text-align:center; padding:10px;"><span style="color:#ff0044; font-size:20px">THE FINAL CHOICE</span><br><br><i style="color:#888">Sang Naga menatapmu. "Apakah dunia ini layak untuk tetap ada seperti sekarang?"</i></div>`, choices);
      return;
    }

    const ex = e.exp || Math.floor(P.lv * 12);
    const dropG = (e.gold || 0) + Math.floor((P.stats?.fortune || 10) * 0.5);
    P.exp += ex; P.gold += dropG; P.kills++;
    if (e.boss) { P.bossKills++; qProgress('kill_boss'); P.items.push('Dark Crystal'); if (Math.random() < .6) P.keys++; }
    qProgress('kill');
    let txt = `<span style="color:#88ffcc">★ MENANG! ★</span> ${e.name} dikalahkan!<br>+${ex} EXP  +${dropG} Gold!`;
    if (e.boss) txt += `<br><span style="color:#ffd700">★ BOS KALAH! Dark Crystal diperoleh! ★</span>`;
    if (state === 'dbattle' && dobjs) { const ob = dobjs.find(o => o.name === e.name && o.x === e.x && o.y === e.y); if (ob) ob.alive = false; }
    state = (state === 'dbattle' ? 'dungeon' : 'over'); curEnemy = null;
    const px = state === 'dungeon' ? P.x * DTW + 16 : (P.x - camX) * TW + 16, py = state === 'dungeon' ? P.y * DTW + 16 : (P.y - camY) * TW + 16;
    spawnParticles(px, py, '#ffd700', 20, 'star'); updateParticles();
    checkLvUp(txt);
    if (state === 'dungeon') drawDungeon(); else drawOver(); updateHUD();
  }

  // function level system
  function checkLvUp(prev) {
    if (P.exp >= P.expNext) {
      P.lv++; P.exp = 0;
      P.statPoints += 5; P.sp = (P.sp || 0) + 1;
      recalcStats();
      P.hp = P.maxHp; P.mp = P.maxMp; P.expNext = P.lv * 28 + 28;
      spawnParticles(state === 'dungeon' ? P.x * DTW + 16 : (P.x - camX) * TW + 16, state === 'dungeon' ? P.y * DTW + 16 : (P.y - camY) * TW + 16, '#ffd700', 25, 'star'); updateParticles();
      let msg = (prev || '') + '<br><span style="color:#ffd700">★★ LEVEL UP! LV ' + P.lv + '! ★★</span><br>+5 Stat Points (Gunakan AETHER CORE)';
      if (P.lv >= 3 && (!P.coreElems || P.coreElems.length === 0)) {
        setLog(msg + '<br><span style="color:#00ffaa">Kekuatan elemen kuno memanggilmu. Apakah kamu ingin menerima Core Elements?</span>', [
          { label: 'YA', fn: () => acceptElements(msg) },
          { label: 'TIDAK', fn: () => { setLog(msg + '<br>Kamu menolak kekuatan elemen untuk saat ini.', moveBtns()); } }
        ]);
        return;
      }
      setLog(msg, moveBtns());
    } else if (prev) setLog(prev, moveBtns());
  }

  function acceptElements(prevMsg) {
    const r = Math.random();
    let num = 1;
    const f = P.stats?.fortune || 10;
    const c4 = 0.001 + (f * 0.0005);
    const c3 = 0.05 + (f * 0.002);
    const c2 = 0.10 + (f * 0.005);

    if (r < c4) num = 4;
    else if (r < c3) num = 3;
    else if (r < c2) num = 2;

    const elems = ['Pyra', 'Aqua', 'Terra', 'Aero'].sort(() => Math.random() - .5);
    P.coreElems = elems.slice(0, num);
    let msg = prevMsg + `<br><span style="color:#00ffaa">★ RESONANSI: Memperoleh Elemen ${P.coreElems.join(', ')}! ★</span>`;
    setLog(msg, moveBtns());
    updateHUD();
  }
  function die() {
    state = 'dead';
    setLog(`<span style="color:#ff0044">✝ KAMU GUGUR ✝</span><br>Kegelapan menelanmu...<br>LV:${P.lv} | Gold:${P.gold} | Kills:${P.kills}`, [{ label: 'BANGKIT LAGI', cls: 'rb', fn: restart }]);
    updateHUD();
  }

  //function restart system 
  function restart() {
    P = { x: 2, y: 3, hp: 30, maxHp: 30, mp: 12, maxMp: 12, atk: 12, def: 6, lv: 1, exp: 0, expNext: 25, gold: 20, keys: 0, items: [], status: 'OK', defBuff: 0, steps: 0, kills: 0, bossKills: 0, chestsOpened: 0, coreElems: [], ascendant: false, antiDebuff: 0, sp: 0, unlockedSpells: ['HEAL'], stats: { might: 10, insight: 10, velocity: 10, fortune: 10, vitalis: 10, aether: 10 }, statPoints: 0, aetherEnergy: 0, aetherState: 0, growth: { atk: 0, spell: 0, dodge: 0, hit: 0, burst: 0, fortune: 0 }, crystalAtk: 0 };
    recalcStats(); P.hp = P.maxHp; P.mp = P.maxMp;
    OCHESTS.forEach(c => c.open = false);
    if (typeof ECHOES !== 'undefined') ECHOES.forEach(e => e.found = false);
    activeQuests = QUESTS.map(q => ({ ...q }));
    state = 'over'; curEnemy = null; inputLock = false; osteps = 0; dfi = 0; dmap = null; dobjs = null; dvis = new Set();

    const introText = `<div style="text-align:center; padding: 10px;">
      <h2 style="color:#ff44aa; margin-bottom:10px;">Luminia: Echoes of the Unwhole</h2>
      <p style="color:#aaa; font-style:italic;">Keseimbangan bukanlah keadaan alami.<br>Ia adalah kebohongan yang dipaksakan... dan selalu retak.</p>
      <p style="color:#888;">Kamu bukanlah pahlawan.<br>Kamu adalah <b>celah</b> di antara dunia dan kehampaan.</p>
    </div>`;

    setLog(introText, [{
      label: 'TERIMA KENYATAAN', fn: () => {
        setLog('Petualangan dimulai... namun dunia ini terasa janggal.', moveBtns());
      }
    }]);
    renderQuests(); drawOver(); updateHUD();
  }
  document.addEventListener('keydown', e => {
    if (state === 'dead' || inputLock) return;
    const k = { 'ArrowUp': [0, -1], 'ArrowDown': [0, 1], 'ArrowLeft': [-1, 0], 'ArrowRight': [1, 0], 'w': [0, -1], 's': [0, 1], 'a': [-1, 0], 'd': [1, 0] };
    if (k[e.key]) { e.preventDefault(); move(...k[e.key]); }
  });
  renderQuests(); drawOver(); updateHUD();
  setInterval(() => { if (state === 'over') drawOver(); else if (state === 'dungeon') drawDungeon(); else if (state === 'library') drawLibrary(); else if (state === 'kingdom') drawKingdom(); else if (state === 'palace') drawPalace(); }, 500);
</script>
